<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Virtual Throttle</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.css"
      rel="stylesheet"
    />
    <style>
      body {
        overscroll-behavior-y: contain;
      }
      .grid-container {
        display: grid;
        grid-template-rows: auto 1fr 1fr;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        grid-template-areas:
          "active-pause fullscreen gear-stepper flap-stepper"
          "airbrake propeller mixture throttle"
          "landing-brake propeller mixture trim";
        gap: 10px;
        height: calc(100vh - 20px);
        padding: 10px;
        place-items: stretch;
        background-color: #333;
        color: white;
      }

      .grid-item {
        background-color: #444;
        border-radius: 5px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 5px;
      }

      .item-active-pause { grid-area: active-pause; }
      .item-fullscreen { grid-area: fullscreen; }
      .item-gear-stepper { grid-area: gear-stepper; background-color: black; }
      .item-flap-stepper { grid-area: flap-stepper; background-color: black; }
      .item-airbrake { grid-area: airbrake; }
      .item-landing-brake { grid-area: landing-brake; background-color: black; }
      .item-propeller { grid-area: propeller; }
      .item-mixture { grid-area: mixture; }
      .item-throttle { grid-area: throttle; }
      .item-trim { grid-area: trim; background-color: black; padding: 0; }

      .button { width: 100%; height: 100%; font-size: small; }
      .stepper-button { width: 100%; height: 50%; }

      .slider-container {
        width: 30px;
        height: 100%;
        margin: 0 auto;
      }

      .slider { height: calc(100% - 30px); width: 30px; }
      .slider .noUi-handle { height: 40px; width: 60px; right: -15px; border-radius: 5px; }
      .slider .noUi-handle::after, .slider .noUi-handle::before { display: none; }

      #airbrakeSlider .noUi-handle { background: white; }
      #propellerSlider .noUi-handle { background: blue; }
      #mixtureSlider .noUi-handle { background: red; }
      #throttleSlider .noUi-handle { background: black; border: 1px solid white;}

      /* Trim Wheel Styles */
      .trim-container { width: 100%; height: 100%; overflow: hidden; position: relative; }
      #trim-display { font-size: 1.5rem; font-weight: bold; color: white; text-align: center; }
      .trim-viewport { position: relative; width: 100%; height: calc(100% - 30px); overflow: hidden; cursor: grab; touch-action: none; }
      .trim-viewport:active { cursor: grabbing; }
      .trim-ruler { position: absolute; width: 100%; will-change: transform; }
      .trim-tick { position: absolute; left: 50%; transform: translateX(-50%); width: 20px; height: 1px; background-color: #666; }
      .trim-tick.major { width: 40px; background-color: #aaa; height: 2px; }
      .trim-tick-label { position: absolute; left: 65%; transform: translateY(-50%); font-size: 10px; color: #888; }
      .trim-center-guide { position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: white; z-index: 10; pointer-events: none; }

      /* Toggle Switch Styles */
      .toggle-switch-container {
        width: 60px; /* Increased width for better touch interaction */
        height: 120px; /* Increased height */
        background-color: #222; /* Darker background */
        border-radius: 30px; /* More pronounced rounding */
        position: relative;
        cursor: pointer;
        border: 2px solid #555; /* Added a border */
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5); /* Inner shadow for depth */
        touch-action: none; /* Prevent default touch behaviors */
        user-select: none; /* Prevent text selection */
        -webkit-user-select: none; /* Safari */
      }

      .toggle-switch {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 10px;
        height: 80%; /* Taller track */
        background-color: #111; /* Very dark track */
        border-radius: 5px;
      }

      .toggle-switch-handle {
        width: 50px; /* Wider handle */
        height: 40px; /* Taller handle */
        background: linear-gradient(145deg, #555, #333); /* Gradient for 3D effect */
        border-radius: 10px; /* Less rounded corners */
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 40px; /* Centered initial position */
        cursor: grab;
        border: 1px solid #666;
        box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        transition: top 0.1s ease-out; /* Faster, smoother transition */
      }

      .toggle-switch-handle:active {
        cursor: grabbing;
        background: linear-gradient(145deg, #444, #222); /* Darken when grabbed */
      }

      #flap-switch-handle {
        background: white;
      }

      #flap-switch-handle:active {
        background: #eee;
      }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  </head>
  <body>
    <div class="grid-container">
      <div class="grid-item item-active-pause">
        <button class="btn btn-primary button" onpointerdown="buttonPress(5)" onpointerup="buttonRelease(5)">Active Pause</button>
      </div>
      <div class="grid-item item-fullscreen">
        <button class="btn btn-secondary button" onpointerdown="toggleFullscreen()">Full Screen</button>
      </div>
      <div class="grid-item item-gear-stepper">
        <div>GEAR</div>
        <div class="toggle-switch-container" id="gear-switch-container">
          <div class="toggle-switch"></div>
          <div class="toggle-switch-handle"></div>
        </div>
      </div>
      <div class="grid-item item-flap-stepper">
        <div>FLAP</div>
        <div class="toggle-switch-container" id="flap-switch-container">
          <div class="toggle-switch"></div>
          <div class="toggle-switch-handle" id="flap-switch-handle"></div>
        </div>
      </div>

      <div class="grid-item item-airbrake"><p>Airbrake</p><div class="slider-container"><div id="airbrakeSlider" class="slider"></div></div></div>
      <div class="grid-item item-propeller"><p>Propeller</p><div class="slider-container"><div id="propellerSlider" class="slider"></div></div></div>
      <div class="grid-item item-mixture"><p>Mixture</p><div class="slider-container"><div id="mixtureSlider" class="slider"></div></div></div>
      <div class="grid-item item-throttle"><p>Throttle</p><div class="slider-container"><div id="throttleSlider" class="slider"></div></div></div>
      
      <div class="grid-item item-landing-brake">
        <div>Land Brake</div>
        <div class="toggle-switch-container" id="landing-brake-switch-container">
          <div class="toggle-switch"></div>
          <div class="toggle-switch-handle"></div>
        </div>
      </div>

      <div class="grid-item item-trim">
        <div id="trim-display">0%</div>
        <div class="trim-container">
          <div class="trim-viewport" id="trimViewport">
            <div class="trim-center-guide"></div>
            <div class="trim-ruler" id="trimRuler"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const socket = io.connect("http://" + document.domain + ":" + location.port);

      function createSlider(id, color, axisName, startValue = 0) {
        const slider = document.getElementById(id);
        noUiSlider.create(slider, {
          start: startValue,
          orientation: "vertical",
          direction: "rtl",
          range: { min: 0, max: 32700 },
        });
        slider.noUiSlider.on("update", function (values, handle) {
          socket.emit("update_joystick_axis", {
            axis: axisName,
            value: Number(values[handle]),
          });
        });
      }
      


      function buttonPress(data) { socket.emit("button_press", { button: data }); }
      function buttonRelease(data) { socket.emit("button_release", { button: data }); }
      function toggleFullscreen() {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      }

      // Trim Wheel Logic (adapted from scroller.html)
      function initTrimWheel() {
        const viewport = document.getElementById('trimViewport');
        const ruler = document.getElementById('trimRuler');
        const display = document.getElementById('trim-display');

        const MIN = -100;
        const MAX = 100;
        // PX_PER_UNIT defines how many pixels of drag correspond to a 1% change in trim.
        // The vJoy range is 0-32700, and the display range is -100% to 100% (200 units).
        // To map 1 pixel of drag to 1 unit of vJoy change, the sensitivity needs to be adjusted.
        // Ratio: 32700 / 200 = 163.5 vJoy units per 1% of trim.
        // We set PX_PER_UNIT to this ratio to achieve a finer, more accurate mapping.
        const PX_PER_UNIT = 163.5; 
        // A lower friction value makes the wheel's inertial spin decay faster.
        // This is adjusted to feel more responsive with the new, more precise scale.
        const FRICTION = 0.98;

        // Start at 0%. Value is derived from currentY. We solve for the currentY that gives value=0.
        // Formula from updateTrim(): value = MAX - ((viewport.offsetHeight / 2 - currentY) / PX_PER_UNIT)
        // For value=0: 0 = MAX - ((viewport.offsetHeight / 2 - currentY) / PX_PER_UNIT)
        // Solving for currentY gives:
        let currentY = (viewport.offsetHeight / 2) - (MAX * PX_PER_UNIT); 
        let isDragging = false;
        let lastY = 0;
        let velocity = 0;
        let rafId = null;

        for (let i = MIN; i <= MAX; i++) {
            const yPos = (MAX - i) * PX_PER_UNIT;
            const tick = document.createElement('div');
            tick.className = `trim-tick ${i % 10 === 0 ? 'major' : ''}`;
            tick.style.top = `${yPos}px`;
            ruler.appendChild(tick);
            if (i % 20 === 0) {
                const label = document.createElement('div');
                label.className = 'trim-tick-label';
                label.style.top = `${yPos}px`;
                label.innerText = i + "%";
                ruler.appendChild(label);
            }
        }

        function updateTrim() {
            const viewportCenter = viewport.offsetHeight / 2;
            const relativePos = viewportCenter - currentY;
            let value = MAX - (relativePos / PX_PER_UNIT);
            value = Math.max(MIN, Math.min(MAX, value));
            
            display.innerText = `${value.toFixed(1)}%`;
            ruler.style.transform = `translateY(${currentY}px)`;
            
            // Convert -100..100 to 0..32700 for vJoy
            const vjoyValue = ((value - MIN) / (MAX - MIN)) * 32700;
            socket.emit("update_joystick_axis", { axis: "slider2", value: vjoyValue });
        }

        function applyInertia() {
            if (isDragging) return;
            velocity *= FRICTION;
            currentY += velocity;

            const minScroll = (viewport.offsetHeight / 2) - ((MAX - MIN) * PX_PER_UNIT);
            const maxScroll = viewport.offsetHeight / 2;
            if (currentY > maxScroll) { currentY = maxScroll; velocity = 0; }
            if (currentY < minScroll) { currentY = minScroll; velocity = 0; }
            
            updateTrim();

            if (Math.abs(velocity) > 0.05) {
                rafId = requestAnimationFrame(applyInertia);
            }
        }
        
        viewport.addEventListener('pointerdown', e => {
            e.preventDefault();
            isDragging = true;
            velocity = 0;
            lastY = e.clientY;
            cancelAnimationFrame(rafId);
            viewport.setPointerCapture(e.pointerId);
        });

        viewport.addEventListener('pointermove', e => {
            if (!isDragging) return;
            const deltaY = e.clientY - lastY;
            velocity = deltaY;
            currentY += deltaY;
            lastY = e.clientY;
            updateTrim();
        });

        viewport.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            viewport.releasePointerCapture(e.pointerId);
            rafId = requestAnimationFrame(applyInertia);
        });

        viewport.addEventListener('pointercancel', (e) => {
            if (!isDragging) return;
            isDragging = false;
            viewport.releasePointerCapture(e.pointerId);
        });

        updateTrim();
      }

      // Toggle Switch Logic

      function createMomentarySwitch(containerId, upButton, downButton) {
        const container = document.getElementById(containerId);
        const handle = container.querySelector(".toggle-switch-handle");

        let isDragging = false;
        let startY = 0;
        let startTop = 0;

        const centerPos = 40;
        const maxUp = 10;
        const maxDown = 70;

        handle.style.top = `${centerPos}px`;

        const onPointerDown = (e) => {
          if (e.target === handle) {
            e.preventDefault();
            isDragging = true;
            startY = e.clientY;
            startTop = handle.offsetTop;
            handle.style.transition = 'none';
            container.setPointerCapture(e.pointerId);
          }
        };

        const onPointerMove = (e) => {
          if (!isDragging) return;
          const deltaY = e.clientY - startY;
          let newTop = startTop + deltaY;
          newTop = Math.max(maxUp, Math.min(newTop, maxDown));
          handle.style.top = `${newTop}px`;
        };

        const onPointerUp = (e) => {
          if (!isDragging) return;
          isDragging = false;
          container.releasePointerCapture(e.pointerId);
          handle.style.transition = 'top 0.2s ease-out';

          const currentTop = handle.offsetTop;
          const upperThreshold = centerPos - 20;
          const lowerThreshold = centerPos + 20;

          if (currentTop < upperThreshold) {
            console.log('Trigger UP');
            buttonPress(upButton);
            setTimeout(() => buttonRelease(upButton), 150);
          } else if (currentTop > lowerThreshold) {
            console.log('Trigger DOWN');
            buttonPress(downButton);
            setTimeout(() => buttonRelease(downButton), 150);
          }
          handle.style.top = `${centerPos}px`;
        };

        container.addEventListener('pointerdown', onPointerDown);
        container.addEventListener('pointermove', onPointerMove);
        container.addEventListener('pointerup', onPointerUp);
        container.addEventListener('pointercancel', onPointerUp);
      }

      function createStatefulSwitch(containerId, upButton, downButton, initialState) {
        const container = document.getElementById(containerId);
        const handle = container.querySelector(".toggle-switch-handle");

        let isDragging = false;
        let startY = 0;
        let startTop = 0;
        let currentState = initialState;

        const centerPos = 40;
        const maxUp = 10;
        const maxDown = 70;

        if (initialState === 'up') {
            handle.style.top = `${maxUp}px`;
        } else if (initialState === 'down') {
            handle.style.top = `${maxDown}px`;
        } else {
            handle.style.top = `${centerPos}px`;
        }

        const onPointerDown = (e) => {
          if (e.target === handle) {
            e.preventDefault();
            isDragging = true;
            startY = e.clientY;
            startTop = handle.offsetTop;
            handle.style.transition = 'none';
            container.setPointerCapture(e.pointerId);
          }
        };

        const onPointerMove = (e) => {
          if (!isDragging) return;
          const deltaY = e.clientY - startY;
          let newTop = startTop + deltaY;
          newTop = Math.max(maxUp, Math.min(newTop, maxDown));
          handle.style.top = `${newTop}px`;
        };

        const onPointerUp = (e) => {
          if (!isDragging) return;
          isDragging = false;
          container.releasePointerCapture(e.pointerId);
          handle.style.transition = 'top 0.2s ease-out';

          const currentTop = handle.offsetTop;
          const upperThreshold = centerPos - 20;
          const lowerThreshold = centerPos + 20;

          if (currentTop < upperThreshold) {
            if (currentState !== 'up') {
              console.log('Trigger UP');
              buttonPress(upButton);
              setTimeout(() => buttonRelease(upButton), 150);
              currentState = 'up';
            }
            handle.style.top = `${maxUp}px`;
          } else if (currentTop > lowerThreshold) {
            if (currentState !== 'down') {
              console.log('Trigger DOWN');
              buttonPress(downButton);
              setTimeout(() => buttonRelease(downButton), 150);
              currentState = 'down';
            }
            handle.style.top = `${maxDown}px`;
          } else {
            if (currentState === 'up') {
              handle.style.top = `${maxUp}px`;
            } else if (currentState === 'down') {
              handle.style.top = `${maxDown}px`;
            } else {
              handle.style.top = `${centerPos}px`;
            }
          }
        };

        container.addEventListener('pointerdown', onPointerDown);
        container.addEventListener('pointermove', onPointerMove);
        container.addEventListener('pointerup', onPointerUp);
        container.addEventListener('pointercancel', onPointerUp);
      }

      document.addEventListener("DOMContentLoaded", function () {
        createSlider("airbrakeSlider", "white", "x", 32700);
        createSlider("propellerSlider", "blue", "y", 32700);
        createSlider("mixtureSlider", "red", "z", 32700);
        createSlider("throttleSlider", "black", "slider1", 0);
        initTrimWheel();
        createStatefulSwitch("gear-switch-container", 1, 2, 'down');
        createMomentarySwitch("flap-switch-container", 3, 4);
        createStatefulSwitch("landing-brake-switch-container", 6, 7, 'down');
      });
    </script>
  </body>
</html>
